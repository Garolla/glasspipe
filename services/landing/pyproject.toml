[project]
name = "glasspipe-landing"
version = "0.1.0"
description = "Redpanda -> Parquet landing service for glasspipe NRT data"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4",
    "pyarrow>=15.0",
    "glasspipe-common",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["landing*"]
