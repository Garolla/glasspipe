# Runs on a Gitea instance this repo is mirrored to from GitHub (Gitea
# pull-mirror: New Migration -> check "This repository will be a
# mirror"). Triggers on push to `main`, which only happens via a merged,
# reviewed PR -- deploy is gated on review the same way the DB schema is
# (ARCHITECTURE.md, principle 4).
#
# `runs-on: self-hosted` assumes a Gitea Actions runner registered on the
# target host with that label -- adjust to match your actual runner
# registration if it differs. The deploy step expects a persistent
# `.env` at /opt/glasspipe/.env on that host (see docker-compose.yml and
# .env.example for what it needs to contain) -- it's deliberately not
# read from the checkout directory, since the runner's workspace is a
# fresh path on every run.
name: deploy

"on":
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Test each package
        run: |
          set -e
          for d in packages/glasspipe_common services/bridge services/landing services/batch_extract orchestration; do
            venv="/tmp/glasspipe-ci-venv-$(basename "$d")"
            python3 -m venv "$venv"
            "$venv/bin/pip" install -q -e "$d[dev]"
            "$venv/bin/pytest" -q "$d"
          done

      - name: Validate SQLMesh project (parse + render, no live DB needed)
        run: |
          set -e
          venv=/tmp/glasspipe-ci-venv-sqlmesh
          python3 -m venv "$venv"
          "$venv/bin/pip" install -q "sqlmesh[clickhouse]"
          SQLMESH__GATEWAYS__CLICKHOUSE__CONNECTION__HOST=localhost \
          SQLMESH__GATEWAYS__CLICKHOUSE__CONNECTION__USERNAME=default \
          "$venv/bin/python" -c "
          from sqlmesh.core.context import Context
          ctx = Context(paths='transform')
          for name in ctx.models:
              ctx.get_model(name).render_query()
          print(f'sqlmesh project OK: {len(ctx.models)} models parsed')
          "

      - name: Validate Dagster definitions against the real workspace
        run: |
          set -e
          venv=/tmp/glasspipe-ci-venv-dagster
          python3 -m venv "$venv"
          "$venv/bin/pip" install -q -e packages/glasspipe_common -e orchestration
          dagster_home=/tmp/glasspipe-ci-dagster-home
          mkdir -p "$dagster_home"
          cp orchestration/dagster.yaml "$dagster_home/dagster.yaml"
          DAGSTER_HOME="$dagster_home" "$venv/bin/dagster" definitions validate -w orchestration/workspace.yaml

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Deploy
        run: |
          set -e
          docker compose --env-file /opt/glasspipe/.env up -d --build
          docker image prune -f
