name: glasspipe

volumes:
  clickhouse_data:
  parquet_data:
  bridge_data:
  sqlmesh_state:
  dagster_history:

services:

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1200M
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --default-log-level=info
    mem_limit: 1536m
    ports:
      - "127.0.0.1:9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        rpk topic create "$$KAFKA_TOPIC" --brokers redpanda:9092 \
          -c retention.ms="$$KAFKA_TOPIC_RETENTION_MS" \
          -c retention.bytes="$$KAFKA_TOPIC_RETENTION_BYTES" \
        || rpk topic alter-config "$$KAFKA_TOPIC" --brokers redpanda:9092 \
          --set retention.ms="$$KAFKA_TOPIC_RETENTION_MS" \
          --set retention.bytes="$$KAFKA_TOPIC_RETENTION_BYTES"
    environment:
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wikipedia.recentchange}
      KAFKA_TOPIC_RETENTION_MS: ${KAFKA_TOPIC_RETENTION_MS:-21600000}
      KAFKA_TOPIC_RETENTION_BYTES: ${KAFKA_TOPIC_RETENTION_BYTES:-2147483648}
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config:/etc/clickhouse-server/config.d:ro
    mem_limit: 2g
    ports:
      - "127.0.0.1:8123:8123" # HTTP (also used by clickhouse-connect and DBeaver)
      - "127.0.0.1:19000:9000" # native protocol -- published on a non-default host port; 9000 collides with common defaults (e.g. Authentik's web UI). Nothing in this pipeline talks to ClickHouse over the native protocol internally (everything uses the HTTP interface, 8123), so this only affects external tools like DBeaver.
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "-", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  bridge:
    build:
      context: services/bridge
    environment:
      STREAM_URL: ${STREAM_URL:-https://stream.wikimedia.org/v2/stream/recentchange}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wikipedia.recentchange}
      CHECKPOINT_PATH: /data/bridge/checkpoint.txt
      HEARTBEAT_PATH: /data/bridge/heartbeat
      MAX_CHECKPOINT_AGE_SECONDS: ${MAX_CHECKPOINT_AGE_SECONDS:-900}
    mem_limit: 128m
    volumes:
      - bridge_data:/data/bridge
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: on-failure

  landing:
    build:
      context: .
      dockerfile: services/landing/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wikipedia.recentchange}
      KAFKA_GROUP_ID: glasspipe-landing
      GLASSPIPE_PARQUET_DIR: /data/parquet
    mem_limit: 256m
    volumes:
      - parquet_data:/data/parquet
    depends_on:
      redpanda:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: on-failure

  batch_extract:
    build:
      context: services/batch_extract
    environment:
      PAGEVIEWS_PROJECT: ${PAGEVIEWS_PROJECT:-en.wikipedia}
      PAGEVIEWS_ACCESS: ${PAGEVIEWS_ACCESS:-all-access}
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DATABASE: raw
      POLL_INTERVAL_HOURS: ${BATCH_POLL_INTERVAL_HOURS:-24}
    mem_limit: 128m
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: on-failure

  orchestration-webserver:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster_home/workspace.yaml"]
    working_dir: /app
    environment: &orchestration_env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: 8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      GLASSPIPE_PARQUET_DIR: /data/parquet
      HEARTBEAT_PATH: /data/bridge/heartbeat
      SQLMESH_PROJECT_DIR: /opt/transform
      PARQUET_RETENTION_DAYS: ${PARQUET_RETENTION_DAYS:-0}
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-wikipedia.recentchange}
      KAFKA_GROUP_ID: glasspipe-landing
      SQLMESH__GATEWAYS__CLICKHOUSE__CONNECTION__HOST: clickhouse
      SQLMESH__GATEWAYS__CLICKHOUSE__CONNECTION__USERNAME: ${CLICKHOUSE_USER:-default}
      SQLMESH__GATEWAYS__CLICKHOUSE__CONNECTION__PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - parquet_data:/data/parquet
      - bridge_data:/data/bridge:ro
      - sqlmesh_state:/opt/transform/.state
      - dagster_history:/opt/dagster_home/history
    mem_limit: 768m
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: on-failure

  orchestration-daemon:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    command: ["dagster-daemon", "run", "-w", "/opt/dagster_home/workspace.yaml"]
    working_dir: /app
    environment: *orchestration_env
    volumes:
      - parquet_data:/data/parquet
      - bridge_data:/data/bridge:ro
      - sqlmesh_state:/opt/transform/.state
      - dagster_history:/opt/dagster_home/history
    mem_limit: 1536m
    depends_on:
      clickhouse:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    restart: on-failure

  alloy:
    image: grafana/alloy:v1.4.3
    profiles: ["observability"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    environment:
      LOKI_ENDPOINT_URL: ${LOKI_ENDPOINT_URL}
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - clickhouse
      - redpanda
    restart: on-failure
