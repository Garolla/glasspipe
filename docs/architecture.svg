<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 800" role="img" aria-label="glasspipe architecture: the Wikimedia SSE stream passes through a custom bridge into Redpanda, gets cleaned, and lands on Parquet as a temporary buffer; a batch source extracts directly into ClickHouse raw_batch. Both raw tables stay separate and are transformed by SQLMesh, orchestrated by Dagster, which observes the upstream part via sensor and executes the downstream runs. SQLMesh keeps its own bookkeeping (backfilled intervals, model fingerprints) in an embedded DuckDB file on a persisted Docker volume, since ClickHouse cannot host it. Alloy collects logs and metrics and ships them to Grafana and Loki already running on the VPS.">
  <style>
    :root {
      --bg: #f4f6f7;
      --surface: #ffffff;
      --surface-2: #eceff1;
      --border: #d6dde1;
      --text: #10181f;
      --text-muted: #4d5c66;
      --text-faint: #8497a1;
      --accent-stream: #0c7e8f;
      --accent-stream-soft: #e1f0f2;
      --accent-batch: #4a4bc4;
      --accent-batch-soft: #e7e7fa;
      --accent-warn: #a8402f;
      --accent-warn-soft: #f7e7e3;
      --accent-neutral: #5b6b76;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0f13;
        --surface: #121a20;
        --surface-2: #172127;
        --border: #263139;
        --text: #e7edf0;
        --text-muted: #a7b6bf;
        --text-faint: #6c7d87;
        --accent-stream: #3fc4d3;
        --accent-stream-soft: #103238;
        --accent-batch: #9a9af3;
        --accent-batch-soft: #211f4a;
        --accent-warn: #e2846f;
        --accent-warn-soft: #3a1f19;
        --accent-neutral: #8ea0ab;
      }
    }
    text { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace; }
    .title-text { font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; fill: var(--text); }
    .svg-text { fill: var(--text); font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif; }
    .svg-faint { fill: var(--text-faint); }

    .lane-stream-box { stroke: var(--accent-stream); fill: var(--accent-stream-soft); }
    .lane-stream-line { stroke: var(--accent-stream); fill: none; }
    .lane-stream-head { fill: var(--accent-stream); }
    .lane-stream-text { fill: var(--accent-stream); }

    .lane-batch-box { stroke: var(--accent-batch); fill: var(--accent-batch-soft); }
    .lane-batch-line { stroke: var(--accent-batch); fill: none; }
    .lane-batch-head { fill: var(--accent-batch); }
    .lane-batch-text { fill: var(--accent-batch); }

    .lane-warn-box { stroke: var(--accent-warn); fill: var(--accent-warn-soft); }
    .lane-warn-line { stroke: var(--accent-warn); fill: none; }
    .lane-warn-head { fill: var(--accent-warn); }
    .lane-warn-text { fill: var(--accent-warn); }

    .neutral-line { stroke: var(--accent-neutral); fill: none; }
    .neutral-head { fill: var(--accent-neutral); }
    .neutral-box { stroke: var(--accent-neutral); fill: var(--surface); }
    .neutral-text { fill: var(--text-muted); }

    .boundary { stroke: var(--text-faint); fill: none; opacity: .5; }
    .dagster-band { stroke: var(--accent-neutral); fill: var(--surface-2); }
  </style>

  <defs>
    <marker id="streamHead" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" class="lane-stream-head"/></marker>
    <marker id="batchHead" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" class="lane-batch-head"/></marker>
    <marker id="warnHead" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" class="lane-warn-head"/></marker>
    <marker id="neutralHead" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><polygon points="0,0 8,4 0,8" class="neutral-head"/></marker>
  </defs>

  <rect x="0" y="0" width="1360" height="800" fill="var(--bg)"/>

  <!-- system boundary -->
  <rect x="20" y="20" width="1300" height="560" rx="16" class="boundary" stroke-width="1.5" stroke-dasharray="3 6"/>
  <text x="40" y="44" class="svg-faint" font-size="10.5" letter-spacing=".04em">RUNNING SYSTEM — EVERYTHING IN HERE SHIPS LOGS/METRICS TO ALLOY</text>

  <!-- dagster band -->
  <rect x="690" y="40" width="620" height="64" rx="10" class="dagster-band" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1000" y="66" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">DAGSTER — orchestration + operational lineage</text>
  <text x="1000" y="84" text-anchor="middle" class="svg-faint" font-size="10.5">native assets (SQLMesh runs) + observed external assets (sensor)</text>

  <!-- dagster arrows -->
  <line x1="990" y1="104" x2="990" y2="146" class="neutral-line" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#neutralHead)"/>
  <text x="1001" y="128" class="neutral-text" font-size="10.5">observes (sensor)</text>

  <line x1="1230" y1="104" x2="1230" y2="426" class="neutral-line" stroke-width="1.6" marker-end="url(#neutralHead)"/>
  <text x="1241" y="270" class="neutral-text" font-size="10.5">runs job</text>

  <!-- future source stub -->
  <rect x="470" y="40" width="160" height="50" rx="8" fill="none" class="neutral-box" stroke-width="1.3" stroke-dasharray="3 4"/>
  <text x="550" y="60" text-anchor="middle" class="svg-faint" font-size="11">another NRT source</text>
  <text x="550" y="75" text-anchor="middle" class="svg-faint" font-size="11">(future)</text>
  <line x1="550" y1="90" x2="550" y2="146" class="neutral-line" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#neutralHead)"/>
  <text x="561" y="122" class="neutral-text" font-size="10.5">extensible</text>

  <!-- NRT lane -->
  <rect x="30" y="150" width="160" height="72" rx="8" class="lane-stream-box" stroke-width="1.4"/>
  <text x="110" y="178" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Wikimedia</text>
  <text x="110" y="194" text-anchor="middle" class="svg-text" font-size="12">EventStreams (SSE)</text>

  <rect x="250" y="150" width="160" height="72" rx="8" class="lane-stream-box" stroke-width="1.4"/>
  <text x="330" y="178" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Bridge</text>
  <text x="330" y="194" text-anchor="middle" class="svg-text" font-size="12">SSE → broker</text>

  <rect x="470" y="150" width="160" height="72" rx="8" class="lane-stream-box" stroke-width="1.4"/>
  <text x="550" y="178" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Redpanda</text>
  <text x="550" y="194" text-anchor="middle" class="svg-text" font-size="12">(broker)</text>

  <rect x="690" y="150" width="160" height="72" rx="8" class="lane-stream-box" stroke-width="1.4"/>
  <text x="770" y="178" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Landing</text>
  <text x="770" y="194" text-anchor="middle" class="svg-text" font-size="12">validate + clean</text>

  <rect x="910" y="150" width="160" height="72" rx="8" class="lane-stream-box" stroke-width="1.4"/>
  <text x="990" y="178" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Parquet</text>
  <text x="990" y="194" text-anchor="middle" class="svg-text" font-size="12">buffer, TTL ~3d</text>

  <!-- NRT arrows -->
  <line x1="190" y1="186" x2="246" y2="186" class="lane-stream-line" stroke-width="1.8" marker-end="url(#streamHead)"/>
  <text x="218" y="140" text-anchor="middle" class="lane-stream-text" font-size="10.5">produces</text>

  <line x1="410" y1="186" x2="466" y2="186" class="lane-stream-line" stroke-width="1.8" marker-end="url(#streamHead)"/>
  <text x="438" y="140" text-anchor="middle" class="lane-stream-text" font-size="10">produces, key=event id</text>

  <line x1="630" y1="186" x2="686" y2="186" class="lane-stream-line" stroke-width="1.8" marker-end="url(#streamHead)"/>
  <text x="658" y="140" text-anchor="middle" class="lane-stream-text" font-size="10.5">consumes</text>

  <line x1="850" y1="186" x2="906" y2="186" class="lane-stream-line" stroke-width="1.8" marker-end="url(#streamHead)"/>
  <text x="878" y="140" text-anchor="middle" class="lane-stream-text" font-size="10">writes, append-only</text>

  <!-- dead letter -->
  <rect x="690" y="262" width="160" height="56" rx="8" class="lane-warn-box" stroke-width="1.4"/>
  <text x="770" y="284" text-anchor="middle" class="svg-text" font-size="12.5" font-weight="600">Dead-letter</text>
  <text x="770" y="299" text-anchor="middle" class="svg-text" font-size="11.5">(quarantine)</text>
  <line x1="770" y1="222" x2="770" y2="258" class="lane-warn-line" stroke-width="1.6" marker-end="url(#warnHead)"/>
  <text x="785" y="244" class="lane-warn-text" font-size="10.5">discards</text>

  <!-- batch lane -->
  <rect x="30" y="430" width="200" height="72" rx="8" class="lane-batch-box" stroke-width="1.4"/>
  <text x="130" y="458" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Batch source</text>
  <text x="130" y="474" text-anchor="middle" class="svg-text" font-size="11.5">(API / file extract)</text>

  <rect x="280" y="430" width="160" height="72" rx="8" class="lane-batch-box" stroke-width="1.4"/>
  <text x="360" y="458" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Extract</text>
  <text x="360" y="474" text-anchor="middle" class="svg-text" font-size="12">scheduled</text>

  <rect x="690" y="430" width="160" height="72" rx="8" class="lane-batch-box" stroke-width="1.4"/>
  <text x="770" y="458" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">ClickHouse</text>
  <text x="770" y="474" text-anchor="middle" class="svg-text" font-size="12">raw_batch</text>

  <rect x="910" y="430" width="160" height="72" rx="8" class="lane-stream-box" stroke-width="1.4"/>
  <text x="990" y="458" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">ClickHouse</text>
  <text x="990" y="474" text-anchor="middle" class="svg-text" font-size="12">raw_nrt</text>

  <rect x="1150" y="430" width="160" height="72" rx="8" class="neutral-box" stroke-width="1.4"/>
  <text x="1230" y="458" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">ClickHouse</text>
  <text x="1230" y="474" text-anchor="middle" class="svg-text" font-size="12">marts / aggregates</text>

  <!-- batch arrows -->
  <line x1="230" y1="466" x2="276" y2="466" class="lane-batch-line" stroke-width="1.8" marker-end="url(#batchHead)"/>
  <text x="253" y="420" text-anchor="middle" class="lane-batch-text" font-size="10.5">extracts</text>

  <line x1="440" y1="466" x2="686" y2="466" class="lane-batch-line" stroke-width="1.8" marker-end="url(#batchHead)"/>
  <text x="563" y="456" text-anchor="middle" class="lane-batch-text" font-size="10.5">loads</text>

  <!-- parquet -> raw_nrt -->
  <line x1="990" y1="222" x2="990" y2="426" class="lane-stream-line" stroke-width="1.8" marker-end="url(#streamHead)"/>
  <text x="1001" y="316" class="lane-stream-text" font-size="10">incremental load</text>
  <text x="1001" y="330" class="lane-stream-text" font-size="10">(idempotent)</text>

  <!-- convergence into marts -->
  <line x1="850" y1="450" x2="1146" y2="450" class="lane-batch-line" stroke-width="1.8" marker-end="url(#batchHead)"/>
  <line x1="1070" y1="482" x2="1146" y2="482" class="lane-stream-line" stroke-width="1.8" marker-end="url(#streamHead)"/>
  <text x="1000" y="405" text-anchor="middle" class="neutral-text" font-size="10.5">SQLMesh — transformation, column lineage</text>
  <text x="880" y="519" text-anchor="middle" class="svg-faint" font-size="10.5">raw_nrt and raw_batch: distinct tables, no forced reconciliation</text>

  <!-- sqlmesh state store -->
  <line x1="1230" y1="502" x2="1230" y2="516" class="neutral-line" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#neutralHead)"/>
  <rect x="1150" y="520" width="160" height="50" rx="8" class="neutral-box" stroke-width="1.4"/>
  <text x="1230" y="542" text-anchor="middle" class="svg-text" font-size="12.5" font-weight="600">SQLMesh state</text>
  <text x="1230" y="558" text-anchor="middle" class="svg-faint" font-size="10">DuckDB, persisted volume</text>

  <!-- git -->
  <rect x="910" y="580" width="200" height="60" rx="8" class="neutral-box" stroke-width="1.4"/>
  <text x="1010" y="604" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Git</text>
  <text x="1010" y="620" text-anchor="middle" class="svg-text" font-size="11.5">versioned SQLMesh models</text>
  <line x1="1010" y1="580" x2="1010" y2="506" class="neutral-line" stroke-width="1.6" marker-end="url(#neutralHead)"/>
  <text x="1023" y="548" class="neutral-text" font-size="10.5">CI: blocks on</text>
  <text x="1023" y="561" class="neutral-text" font-size="10.5">orphaned column</text>

  <!-- alloy / grafana -->
  <line x1="610" y1="540" x2="610" y2="606" class="neutral-line" stroke-width="1.6" stroke-dasharray="2 4" marker-end="url(#neutralHead)"/>
  <text x="622" y="570" class="neutral-text" font-size="10.5">logs (containers) +</text>
  <text x="622" y="583" class="neutral-text" font-size="10.5">metrics (Prometheus)</text>

  <rect x="540" y="610" width="140" height="60" rx="8" class="neutral-box" stroke-width="1.4"/>
  <text x="610" y="636" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Alloy</text>
  <text x="610" y="652" text-anchor="middle" class="svg-faint" font-size="10">collects</text>

  <line x1="610" y1="670" x2="610" y2="708" class="neutral-line" stroke-width="1.6" marker-end="url(#neutralHead)"/>
  <text x="622" y="694" class="neutral-text" font-size="10.5">ships</text>

  <rect x="440" y="712" width="340" height="64" rx="10" class="neutral-box" stroke-width="1.4"/>
  <text x="610" y="738" text-anchor="middle" class="svg-text" font-size="13" font-weight="600">Grafana + Loki</text>
  <text x="610" y="754" text-anchor="middle" class="svg-text" font-size="11.5">(existing VPS)</text>
</svg>
